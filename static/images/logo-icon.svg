<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="goldMetallicIcon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF2D6" />
      <stop offset="35%" stop-color="#DFC49E" />
      <stop offset="70%" stop-color="#C5A880" />
      <stop offset="100%" stop-color="#8E6F45" />
    </linearGradient>
    
    <linearGradient id="shieldGradIcon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E2028" />
      <stop offset="100%" stop-color="#08090C" />
    </linearGradient>

    <linearGradient id="glowGradIcon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C5A880" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#FFF2D6" stop-opacity="1" />
      <stop offset="100%" stop-color="#8E6F45" stop-opacity="0.6" />
    </linearGradient>

    <filter id="goldGlowIcon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Hexagonal Shield Base -->
  <polygon points="32,3 59,17 59,47 32,61 5,47 5,17" fill="url(#shieldGradIcon)" stroke="url(#goldMetallicIcon)" stroke-width="2" />
  
  <!-- Inner Rim -->
  <polygon points="32,7 55,20 55,44 32,57 9,44 9,20" fill="none" stroke="#C5A880" stroke-opacity="0.25" stroke-width="1" />

  <!-- Aerodynamic Sports Car Silhouette -->
  <!-- Roofline & Hood -->
  <path d="M 14 36 C 19 29, 27 22, 36 22 C 44 22, 50 28, 54 35" fill="none" stroke="url(#glowGradIcon)" stroke-width="2.8" stroke-linecap="round" filter="url(#goldGlowIcon)" />
  
  <!-- Window Glass Line -->
  <path d="M 23 34 C 28 27, 35 26, 41 26 C 46 26, 50 30, 52 34 Z" fill="url(#goldMetallicIcon)" fill-opacity="0.25" stroke="url(#goldMetallicIcon)" stroke-width="1" />

  <!-- Lower Body & Aerodynamic Splitter -->
  <path d="M 9 39 C 18 39, 27 40, 40 40 C 49 40, 55 39, 58 38" fill="none" stroke="url(#goldMetallicIcon)" stroke-width="2.4" stroke-linecap="round" />

  <!-- Headlight Laser Point -->
  <circle cx="54" cy="37" r="1.8" fill="#FFF8EB" filter="url(#goldGlowIcon)" />
  <circle cx="11" cy="38" r="1.5" fill="#FF4444" />

  <!-- Wheels Accent Fins -->
  <path d="M 16 41 A 4.5 4.5 0 0 1 25 41" fill="none" stroke="url(#goldMetallicIcon)" stroke-width="2" stroke-linecap="round" />
  <path d="M 43 41 A 4.5 4.5 0 0 1 52 41" fill="none" stroke="url(#goldMetallicIcon)" stroke-width="2" stroke-linecap="round" />
</svg>
