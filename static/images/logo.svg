<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" fill="none">
  <defs>
    <!-- Gold Metallic Gradients -->
    <linearGradient id="goldMetallic" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF2D6" />
      <stop offset="35%" stop-color="#DFC49E" />
      <stop offset="70%" stop-color="#C5A880" />
      <stop offset="100%" stop-color="#8E6F45" />
    </linearGradient>
    
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E2028" />
      <stop offset="100%" stop-color="#0A0B0E" />
    </linearGradient>

    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C5A880" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#FFF2D6" stop-opacity="1" />
      <stop offset="100%" stop-color="#8E6F45" stop-opacity="0.6" />
    </linearGradient>

    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- CREATIVE AUTOMOTIVE EMBLEM (Left) -->
  <g transform="translate(6, 6)">
    <!-- Hexagonal / Shield Background -->
    <polygon points="24,1 46,12 46,36 24,47 2,36 2,12" fill="url(#shieldGrad)" stroke="url(#goldMetallic)" stroke-width="1.5" />
    
    <!-- Subtle Inner Hexagon Ring -->
    <polygon points="24,4 43,14 43,34 24,44 5,34 5,14" fill="none" stroke="#C5A880" stroke-opacity="0.25" stroke-width="0.75" />

    <!-- Sleek Aerodynamic Sports Car Silhouette -->
    <!-- Roofline & Hood -->
    <path d="M 10 28 C 14 23, 20 17, 27 17 C 33 17, 37 22, 41 27" fill="none" stroke="url(#glowGrad)" stroke-width="2.2" stroke-linecap="round" filter="url(#goldGlow)" />
    
    <!-- Window / Cockpit Arc -->
    <path d="M 17 26 C 21 21, 26 20, 31 20 C 35 20, 38 23, 39 26 Z" fill="url(#goldMetallic)" fill-opacity="0.2" stroke="url(#goldMetallic)" stroke-width="0.8" />

    <!-- Lower Body / Speed Line -->
    <path d="M 6 30 C 13 30, 20 31, 30 31 C 37 31, 41 30, 44 29" fill="none" stroke="url(#goldMetallic)" stroke-width="1.8" stroke-linecap="round" />

    <!-- Headlight & Taillight Speed Sparks -->
    <circle cx="41" cy="28.5" r="1.3" fill="#FFF2D6" filter="url(#goldGlow)" />
    <circle cx="8" cy="29.5" r="1.1" fill="#FF4D4D" />

    <!-- Dynamic Wheel Arches / Aerodynamic Fins -->
    <path d="M 11 31 A 3.5 3.5 0 0 1 18 31" fill="none" stroke="url(#goldMetallic)" stroke-width="1.5" stroke-linecap="round" />
    <path d="M 32 31 A 3.5 3.5 0 0 1 39 31" fill="none" stroke="url(#goldMetallic)" stroke-width="1.5" stroke-linecap="round" />
  </g>

  <!-- CREATIVE TYPOGRAPHY: Syartk -->
  <g transform="translate(64, 13)">
    <!-- Main Brand Wordmark: Syartk -->
    <text x="0" y="25" font-family="'Cairo', 'Outfit', 'Segoe UI', -apple-system, sans-serif" font-weight="900" font-size="28" letter-spacing="1.5" fill="url(#goldMetallic)">
      Syartk
    </text>
    
    <!-- Descriptor Subtitle -->
    <text x="1.5" y="38" font-family="'Outfit', 'Cairo', sans-serif" font-weight="700" font-size="8" letter-spacing="3.5" fill="#E0CAAA" opacity="0.85">
      LUXURY AUTOMOTIVE
    </text>
  </g>
</svg>
